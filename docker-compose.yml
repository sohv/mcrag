version: '3.8'

services:
  # Redis service for caching and session storage
  redis:
    image: redis:7-alpine
    container_name: mcrag-redis
    restart: unless-stopped
    ports:
      - "6380:6379"  # Use port 6380 to avoid conflict with system Redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MCRAG Backend API
  mcrag-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcrag-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # Database Configuration
      REDIS_URL: redis://redis:6379
      
      # Server Configuration
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8001
      
      # LLM Configuration - OpenRouter
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_URL: https://openrouter.ai/api/v1
      
      # Model Configuration
      MODEL_GENERATOR: google/gemini-flash-1.5
      MODEL_CRITIC1: openai/gpt-4o-mini
      MODEL_CRITIC2: deepseek/deepseek-r1
      
      # Production Settings
      DEBUG: "false"
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: "1"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  redis_data:
    driver: local

networks:
  default:
    name: mcrag-network